name: DevSecOps CI Pipeline

on:
  push:
    branches: [main]

jobs:
  security-and-quality-audit:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout Code (fetch-depth: 0 is required for Gitleaks)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2. Setup Node environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install packages for Snyk/Linting
      - name: Install Dependencies
        run: npm install

      # 4. Secret Scanning (Gitleaks)
      - name: Gitleaks Scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Software Composition Analysis (Snyk)
      - name: Snyk Vulnerability Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # 6. Notify n8n (Runs regardless of success or failure)
      - name: Notify n8n
        if: always() 
        run: |
          curl -X POST https://tom716-n8n-free.hf.space/webhook/security-alert \
          -H "Content-Type: application/json" \
          -d '{"status": "${{ job.status }}", "repo": "${{ github.repository }}", "commit": "${{ github.sha }}"}'